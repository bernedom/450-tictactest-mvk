name: Coverage History

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coverage-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Compute coverage percentages
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          generate-coverage-badge: false
          generate-branches-badge: false

      - name: Build benchmark data point
        run: |
          python3 -c "
          import json
          data = [
              {'name': 'Instruction coverage', 'unit': '%', 'value': float('${{ steps.jacoco.outputs.coverage }}') * 100},
              {'name': 'Branch coverage', 'unit': '%', 'value': float('${{ steps.jacoco.outputs.branches }}') * 100},
          ]
          json.dump(data, open('coverage-data.json', 'w'))
          "

      - name: Store coverage history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: coverage-data.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: coverage-history
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
